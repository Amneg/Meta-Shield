<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MetaShield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="header-text">
      <h1>🛡️ MetaShield</h1>
      <p>Share Files, Not Your Identity.</p>
    </div>
    <button id="themeToggleBtn">🌙 Dark Mode</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden />

  <div id="dropZone">
    <label for="fileInput" id="selectImageBtn">Choose Image</label>
    <p>or drag & drop an image here</p>
  </div>

  <div id="previewArea" hidden>
    <div class="card">
      <img id="previewImg" alt="Selected image preview" />
      <p id="fileName"></p>
    </div>

    <div id="riskScoreArea" class="card">
      <p id="riskScoreText"></p>
    </div>

    <div id="findingsList" class="card"></div>

    <div id="locationArea" class="card" hidden></div>

    <button id="toggleRawDataBtn">Show All Extracted Data</button>
    <div id="rawDataArea" class="card" hidden></div>

    <div id="cleanResultArea" class="card" hidden>
      <p><strong>✅ Cleaned file metadata</strong></p>
      <div id="cleanDataArea"></div>
    </div>

    <div class="actions">
      <button id="removeMetadataBtn">Remove Metadata</button>
      <button id="resetBtn">New Image</button>
    </div>
  </div>

  <p class="footer">🔒 Your files are processed locally.</p>

  <script src="../lib/exifr.js"></script>
  <script src="../js/metadata.js"></script>
  <script src="../js/riskEngine.js"></script>
  <script src="../js/cleaner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
